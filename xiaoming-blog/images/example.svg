<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="博客封面示例图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/>
      <stop offset="1" stop-color="#141722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.6">
      <stop offset="0" stop-color="#00e6a8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e6a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e6a8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <text x="84" y="268" font-family="ui-monospace, Consolas, monospace" font-size="21" letter-spacing="7" fill="#00e6a8">GITHUB PAGES BLOG</text>
  <text x="80" y="376" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="#e7eaf1">写点东西</text>
  <text x="84" y="446" font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#8b93a6">just markdown + images</text>
  <rect x="84" y="500" width="200" height="4" rx="2" fill="url(#line)"/>
  <circle cx="300" cy="502" r="5" fill="#00e6a8" fill-opacity="0.9"/>
</svg>
