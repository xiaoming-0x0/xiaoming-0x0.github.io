<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小明的博客</title>
  <meta name="description" content="小明的个人博客：技术笔记、折腾记录和一些不成熟的想法。">
  <meta name="theme-color" content="#08090c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2300e6a8'/%3E%3C/svg%3E">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="./feed.xml">
  <link rel="stylesheet" href="./assets/css/style.css?v=20261110">
  <script>
    (function () {
      try {
        var u = new URLSearchParams(location.search).get('theme');
        if (u === 'light' || u === 'dark') { localStorage.setItem('xiaoming-blog-theme', u); }
        var t = localStorage.getItem('xiaoming-blog-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="./index.html"><span class="brand-dot"></span><span class="brand-name">小明的博客</span></a>
      <nav class="nav-links" id="nav-links">
        <a href="./index.html">首页</a>
        <a href="./tags.html">标签</a>
        <a href="./about.html">关于</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero fade-in">
      <div class="hero-eyebrow" id="hero-eyebrow">记录代码、折腾与思考</div>
      <h1 id="hero-title">在代码与生活之间，<span class="hl">写点什么</span></h1>
      <p id="hero-text">这里放技术笔记、踩坑记录和生活碎片。</p>
    </section>

    <div class="toolbar">
      <label class="search-box" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="搜索标题、摘要、标签…" autocomplete="off" spellcheck="false">
        <kbd class="kbd">/</kbd>
      </label>
      <div class="tag-row" id="tag-row"></div>
    </div>

    <div class="timeline" id="timeline"></div>
    <div id="list-state"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span id="footer-text">© 2026 小明 · 保留所有想法</span>
      <span class="footer-meta"><a href="./feed.xml">RSS</a> · <a href="./tags.html">标签</a> · <a href="./about.html">关于</a></span>
    </div>
  </footer>

  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/index.js"></script>
</body>
</html>
